<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSE-C mockup</title>
<style>
  :root { --bg: #f2f2f6; --card: #fff; --acc: #007aff; --tx: #1c1c1e; --sub: #8e8e93; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx);
         font-family: -apple-system, 'Hiragino Sans', sans-serif; }
  .app { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 28px; margin: 6px 0 2px; }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 14px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid #d1d1d6; border-radius: 999px; padding: 8px 16px;
          font-size: 15px; background: #fff; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  .chords { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .ch { background: #eef4ff; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px;
         font-size: 17px; font-weight: 700; background: var(--acc); color: #fff; margin-top: 4px; }
  .btn.ghost { background: #e5e5ea; color: var(--acc); }
  .btn:disabled { opacity: .4; }
  .roll { height: 120px; position: relative; background: #fafafa; border-radius: 10px;
          margin-top: 10px; overflow: hidden; }
  .n { position: absolute; height: 5px; background: #ff9f0a; border-radius: 3px; }
  .n.mel { background: var(--acc); height: 6px; }
  .row { display: flex; gap: 8px; }
  .row .btn { margin-top: 8px; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .credit { font-size: 11px; color: var(--sub); margin-top: 16px; }
</style>
</head>
<body>
<div class="app">
  <h1>MUSE-C</h1>
  <div class="sub">Music AI with You! — 言葉を選ぶだけでピアノ曲の断片ができる</div>

  <div class="card">
    <div class="sub">1. 言葉を選ぶ</div>
    <div class="chips" id="moods"></div>
  </div>

  <div class="card">
    <div class="sub">2. コード進行（AIが提案）</div>
    <div class="chords" id="chords"><span class="sub">言葉を選ぶと表示されます</span></div>
  </div>

  <div class="card">
    <button class="btn" id="gen">生成する</button>
    <div class="sub" id="stat" style="margin-top:8px">待機中</div>
    <div class="roll" id="roll"></div>
    <div class="row">
      <button class="btn ghost" id="play" disabled>試聴</button>
      <button class="btn ghost" id="regen" disabled>作り直し</button>
      <button class="btn ghost" id="save" disabled>MIDI保存</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="credit">学習データ: POP909 Dataset (CC BY 4.0) ＋ 自作・許諾済みピアノMIDI ／ 生成物は特定楽曲の複製ではありません</div>
</div>
<script>
const MOODS = {
  '青春':   { key: [0,'maj'], prog: [[0,'maj'],[7,'maj'],[9,'min'],[5,'maj']] },
  '切ない': { key: [9,'min'], prog: [[0,'min'],[8,'maj'],[3,'maj'],[7,'maj']] },
  '夜':     { key: [9,'min'], prog: [[0,'min'],[5,'min'],[8,'maj'],[7,'maj']] },
  '疾走感': { key: [2,'min'], prog: [[0,'min'],[8,'maj'],[5,'min'],[7,'maj']] },
  '透明感': { key: [0,'maj'], prog: [[0,'maj7'],[4,'min7'],[5,'maj7'],[7,'maj']] },
  '希望':   { key: [7,'maj'], prog: [[0,'maj'],[9,'min'],[5,'maj'],[7,'maj']] },
  '緊張感': { key: [4,'min'], prog: [[0,'min'],[0,'min'],[1,'maj'],[1,'maj']] },
};
const NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
let mood = '青春';
const moodEl = document.getElementById('moods');
Object.keys(MOODS).forEach(m => {
  const b = document.createElement('button');
  b.className = 'chip' + (m === mood ? ' on' : '');
  b.textContent = m;
  b.onclick = () => { mood = m;
    moodEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === m));
    showChords();
  };
  moodEl.appendChild(b);
});
function chords() {
  const m = MOODS[mood], out = [];
  for (let k = 0; k < 2; k++) for (const [r, q] of m.prog) out.push([(m.key[0] + r) % 12, q]);
  return out.slice(0, 8);
}
function showChords() {
  document.getElementById('chords').innerHTML =
    chords().map(([r, q]) => `<span class="ch">${NAMES[r]}${q}</span>`).join('');
}
showChords();
// デモ用ピアノロール（ダミー描画）
function drawRoll() {
  const el = document.getElementById('roll');
  el.innerHTML = '';
  let seed = [...mood].reduce((a, c) => a + c.charCodeAt(0), 7);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) {
    const d = document.createElement('div');
    const mel = rnd() > 0.72;
    d.className = 'n' + (mel ? ' mel' : '');
    d.style.left = (rnd() * 97) + '%';
    d.style.top = (8 + rnd() * 100) + 'px';
    d.style.width = (1 + rnd() * 4) + '%';
    el.appendChild(d);
  }
}
document.getElementById('gen').onclick = () => {
  const st = document.getElementById('stat');
  st.textContent = '生成中…（デモ表示のため約2秒）';
  ['play', 'regen', 'save'].forEach(id => document.getElementById(id).disabled = true);
  setTimeout(() => {
    drawRoll();
    st.textContent = '完成：8小節';
    document.getElementById('meta').textContent =
      '音数/小節: ' + Array.from({length: 8}, () => 12 + Math.floor(Math.random() * 20)).join(', ');
    ['play', 'regen', 'save'].forEach(id => document.getElementById(id).disabled = false);
  }, 2000);
};
</script>
</body>
</html>
